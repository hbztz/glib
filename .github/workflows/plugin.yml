name: Dify-Plugin-ARM64-Builder-V2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dify Source
        uses: actions/checkout@v4
        with:
          repository: 'langgenius/dify'
          # 如果你的 Dify 是 1.11.4，这里尝试匹配对应的标签
          # 如果报错，请改回 'main'
          ref: 'main' 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Find and Build Plugin Daemon
        run: |
          # 自动寻找包含 plugin-daemon 相关 Dockerfile 的目录
          # 排除 volumes 映射目录，寻找真正的源码构建目录
          TARGET_DIR=$(find . -name "Dockerfile" | grep "plugin_daemon" | head -n 1 | xargs dirname)
          
          if [ -z "$TARGET_DIR" ]; then
            echo "错误：找不到 plugin_daemon 的构建目录！"
            ls -R # 打印目录结构方便排查
            exit 1
          fi
          
          echo "找到构建目录: $TARGET_DIR"
          
          docker buildx build \
            --platform linux/arm64 \
            -t langgenius/dify-plugin-daemon:0.5.2-local \
            --outputs type=docker,dest=/tmp/plugin_daemon_arm64.tar \
            $TARGET_DIR

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-daemon-arm64
          path: /tmp/plugin_daemon_arm64.tar
          retention-days: 1
