name: Dify-Plugin-ARM64-Builder-SuperFinal

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dify Source
        uses: actions/checkout@v4
        with:
          repository: 'langgenius/dify'
          # 如果你的离线包是 1.11.4，这里可以显式指定标签
          ref: 'main' 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Locate and Build Plugin Daemon
        run: |
          # 1. 精准寻找包含 "plugin" 和 "daemon" 逻辑的 Dockerfile
          # 我们不再用特定的路径，而是直接搜 Dockerfile 内容或文件名
          echo "正在全仓库搜索插件构建文件..."
          
          # 尝试定位 Dockerfile
          DOCKERFILE_PATH=$(find . -name "Dockerfile" | grep -E "plugin_daemon|plugin" | head -n 1)
          
          if [ -z "$DOCKERFILE_PATH" ]; then
            echo "未找到匹配的 Dockerfile，打印根目录结构："
            ls -F
            exit 1
          fi
          
          TARGET_DIR=$(dirname "$DOCKERFILE_PATH")
          echo "定位成功！构建目录为: $TARGET_DIR"
          echo "Dockerfile 内容预览:"
          head -n 5 "$DOCKERFILE_PATH"

          # 2. 执行 ARM64 构建
          docker buildx build \
            --platform linux/arm64 \
            -t langgenius/dify-plugin-daemon:0.5.2-local \
            --outputs type=docker,dest=/tmp/plugin_daemon_arm64.tar \
            "$TARGET_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-daemon-arm64
          path: /tmp/plugin_daemon_arm64.tar
          retention-days: 1
