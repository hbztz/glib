name: Dify-Plugin-ARM64-Source-Build-Fixed

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dify Source
        uses: actions/checkout@v4
        with:
          repository: 'langgenius/dify'
          ref: 'main'

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Official Plugin Daemon ARM64
        run: |
          # 1. 现场编写 Dockerfile (基于 API 源码环境)
          cat <<EOF > Dockerfile.plugin
          FROM python:3.12-slim-bookworm
          RUN apt-get update && apt-get install -y --no-install-recommends \
              curl libmagic1 libffi-dev libssl-dev gcc build-essential \
              && rm -rf /var/lib/apt/lists/*
          WORKDIR /app
          COPY api/requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY api/ .
          EXPOSE 5002
          CMD ["python", "-m", "core.plugin.daemon"]
          EOF
          
          # 2. 执行构建并导出为 tar 包
          # 使用 --output 类型为 docker 来兼容老版本 buildx
          docker buildx build \
            --platform linux/arm64 \
            -t langgenius/dify-plugin-daemon:0.5.2-local \
            --output type=docker,dest=plugin_daemon_arm64.tar \
            -f Dockerfile.plugin .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-daemon-arm64
          path: plugin_daemon_arm64.tar
          retention-days: 1
