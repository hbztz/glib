name: Dify-Plugin-ARM64-Builder-Final

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dify Source
        uses: actions/checkout@v4
        with:
          repository: 'langgenius/dify'
          ref: 'main' # 或者指定为 'v0.12.1' 等具体版本

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Plugin Daemon ARM64
        run: |
          # 尝试进入最新版本中插件守护进程的构建目录
          # 路径 A: 较新版本的标准路径
          # 路径 B: 1.11.x 系列的路径
          if [ -d "docker/volumes/plugin_daemon" ]; then
            TARGET="docker/volumes/plugin_daemon"
          elif [ -d "api/core/plugin/host" ]; then
            TARGET="api/core/plugin/host"
          else
            # 最后的保命手段：全盘搜索包含 plugin 关键字的 Dockerfile
            TARGET=$(find . -name "Dockerfile" | grep "plugin" | head -n 1 | xargs dirname)
          fi

          if [ -z "$TARGET" ]; then
             echo "Fatal: Could not find plugin directory."
             ls -R
             exit 1
          fi

          echo "Target building directory is: $TARGET"
          
          docker buildx build \
            --platform linux/arm64 \
            -t langgenius/dify-plugin-daemon:0.5.2-local \
            --outputs type=docker,dest=/tmp/plugin_daemon_arm64.tar \
            $TARGET

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-daemon-arm64
          path: /tmp/plugin_daemon_arm64.tar
          retention-days: 1
