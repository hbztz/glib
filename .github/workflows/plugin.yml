name: Dify-Plugin-ARM64-Final-Success

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Dify Source
        uses: actions/checkout@v4
        with:
          repository: 'langgenius/dify'
          ref: 'main' 

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Plugin Daemon ARM64
        run: |
          # 针对 1.11.x / 1.12.x 版本，插件守护进程的 Dockerfile 路径通常是这里：
          # 我们先暴力检查两个最可能的路径
          if [ -f "api/core/plugin/host/Dockerfile" ]; then
            TARGET_DIR="api/core/plugin/host"
          elif [ -f "docker/volumes/plugin_daemon/Dockerfile" ]; then
            TARGET_DIR="docker/volumes/plugin_daemon"
          else
            # 如果还找不到，用最原始的 find 遍历所有子目录
            TARGET_DIR=$(find . -path "*/plugin*/Dockerfile" | head -n 1 | xargs dirname)
          fi

          if [ -z "$TARGET_DIR" ] || [ "$TARGET_DIR" = "." ]; then
            echo "错误：依然找不到 Dockerfile，深度扫描目录..."
            find . -name "Dockerfile"
            exit 1
          fi

          echo "确定的构建目录为: $TARGET_DIR"
          
          docker buildx build \
            --platform linux/arm64 \
            -t langgenius/dify-plugin-daemon:0.5.2-local \
            --outputs type=docker,dest=/tmp/plugin_daemon_arm64.tar \
            "$TARGET_DIR"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-daemon-arm64
          path: /tmp/plugin_daemon_arm64.tar
          retention-days: 1
