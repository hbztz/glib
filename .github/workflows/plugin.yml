name: Dify-Plugin-ARM-Native-Packer

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build from API Base
        run: |
          # 1. 直接编写 Dockerfile，以官方 API 镜像为底座
          # 这样能保证容器内包含所有的 core/plugin 源码和依赖
          cat <<EOF > Dockerfile.native
          FROM langgenius/dify-api:1.11.4
          
          # 暴露插件通信端口
          EXPOSE 5002
          
          # 关键：指定运行插件守护进程
          # 这与 Dify 官方定义 plugin-daemon 的行为完全一致
          ENTRYPOINT ["python", "-m", "core.plugin.daemon"]
          EOF

          # 2. 构建 ARM64 版本的插件镜像
          docker buildx build \
            --platform linux/arm64 \
            -t langgenius/dify-plugin-daemon:0.5.2-local \
            --output type=docker,dest=dify_plugin_native_arm64.tar \
            -f Dockerfile.native .

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dify-plugin-native-arm64
          path: dify_plugin_native_arm64.tar
